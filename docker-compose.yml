services:
  postgres:
    image: postgres:16-alpine
    container_name: data-vault-postgres
    environment:
      POSTGRES_DB: vault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_raw_vault.sql:/docker-entrypoint-initdb.d/001_raw_vault.sql:ro
      - ./migrations/002_ecommerce_domain.sql:/docker-entrypoint-initdb.d/002_ecommerce_domain.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
